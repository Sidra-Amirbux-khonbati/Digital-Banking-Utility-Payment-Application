<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Customer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef3f9;
}

/* Navbar */

header{
    background:#004080;
    color:white;
}

.navbar{
    max-width:1300px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 30px;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.navbar ul{
    display:flex;
    list-style:none;
}

.navbar li{
    margin-left:25px;
}

.navbar a{
    color:white;
    text-decoration:none;
    font-size:17px;
}

.navbar a:hover,
.navbar a.active{
    color:#FFD700;
}

/* Content */

.page-title{
    text-align:center;
    margin:30px 0 20px;
    color:#004080;
}

.form-container{
    width:95%;
    max-width:1400px;
    margin:auto;
    background:white;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
    overflow:hidden;
}

.form-container iframe{
    width:100%;
    height:1000px;      /* Increase if your form is longer */
    border:none;
}
.modal{

    display:none;

    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.45);

    justify-content:center;

    align-items:center;

    z-index:9999;

}

.modal-box{

    width:480px;

    background:white;

    border-radius:15px;

    padding:35px;

    text-align:center;

    box-shadow:0 20px 40px rgba(0,0,0,.25);

    animation:popup .35s ease;

}

.checkmark{

    width:80px;
    height:80px;

    margin:auto;

    background:#2ecc71;

    color:white;

    border-radius:50%;

    font-size:45px;

    line-height:80px;

    margin-bottom:20px;

}

.modal-box h2{

    color:#004080;

    margin-bottom:20px;

}

#customerDetails{

    text-align:left;

    line-height:32px;

    font-size:16px;

    margin-bottom:30px;

}

#goHomeBtn{

    width:100%;

    padding:15px;

    border:none;

    background:#004080;

    color:white;

    font-size:17px;

    border-radius:8px;

    cursor:pointer;

}

#goHomeBtn:hover{

    background:#0060c0;

}

@keyframes popup{

    from{

        transform:scale(.8);

        opacity:0;

    }

    to{

        transform:scale(1);

        opacity:1;

    }

}

</style>

</head>

<body>

<header>

<div class="navbar">

<div class="logo">🏦 Banking_Billing System</div>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="createcustomer.html" class="active">Create CustomerAccount</a></li>
<li><a href="transactions.html">Transactions</a></li>
<li><a href="admin/admin_dashboard.html">Admin</a></li>

<li><a href="balance.html">Balance Inquiry</a></li>
<li><a href="history.html">History Inquiry</a></li>
</ul>

</div>

</header>

<h1 class="page-title">Create Customer Account</h1>

<div class="form-container">

<iframe src="accountForm.html"></iframe>
</div>
<div id="successModal" class="modal">
    <div class="modal-box">
        <div class="checkmark">
            ✓
        </div>
        <h2>Customer Created Successfully</h2>
        <div id="customerDetails"></div>
        <button id="goHomeBtn">
            Go to Home
        </button>
    </div>
</div>
</body>
</html>
