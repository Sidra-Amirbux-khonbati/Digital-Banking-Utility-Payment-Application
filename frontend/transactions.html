<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions | Banking Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f7fb;
}

/* Navbar */

header{
    background:#004080;
    color:#fff;
    padding:15px 40px;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

nav h2{
    font-size:24px;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
}

/* nav ul li a:hover{
    color:#FFD700;
} */

/* .navbar a:hover,
.navbar a.active{
    color:#FFD700;
} */
 nav ul li a:hover,
nav ul li a.active {
    color: #FFD700;
}

/* Container */

.container{
    width:90%;
    max-width:900px;
    margin:40px auto;
    background:white;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    padding:30px;
}

/* Tabs */

.tabs{
    display:flex;
    margin-bottom:30px;
}

.tabs button{
    flex:1;
    padding:15px;
    border:none;
    background:#004080;
    color:white;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

.tabs button.active{
    background:#FFD700;
    color:black;
    font-weight:bold;
}

.tabs button:hover{
    background:#336699;
    transition:0.3s;
}

/* Forms */

.form{
    display:none;
}

.form.active{
    display:block;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input, textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button.submit{
    width:100%;
    padding:14px;
    background:#004080;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button.submit:hover{
    background:#6d96c4;
}
/* Success Modal */

.modal{

    display:none;

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.45);

    justify-content:center;

    align-items:center;

    z-index:9999;

}

.modal-content{

    width:420px;

    background:white;

    border-radius:12px;

    padding:30px;

    text-align:center;

    box-shadow:0 10px 35px rgba(0,0,0,.25);

    animation:popup .3s ease;

}

.success-icon{

    width:70px;
    height:70px;

    margin:auto;

    border-radius:50%;

    background:#2ecc71;

    color:white;

    font-size:38px;

    line-height:70px;

    margin-bottom:20px;

}

.modal-content h2{

    color:#004080;

    margin-bottom:20px;

}

#transactionDetails{

    text-align:left;

    line-height:30px;

    margin-bottom:25px;

}

#closeModal{

    width:100%;

    padding:12px;

    background:#004080;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:16px;

}

#closeModal:hover{

    background:#002f66;

}

@keyframes popup{

    from{

        transform:scale(.8);

        opacity:0;

    }

    to{

        transform:scale(1);

        opacity:1;

    }

}
</style>

</head>
<body>

<header>

<nav>

<h2>🏦 Banking_Billing System</h2>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="createCustomer.html">Create CustomerAccount</a></li>
<li><a href="transactions.html" class="active">Transactions</a></li>
<li><a href="admin/admin_dashboard.html">Admin</a></li>

<li><a href="balance.html">Balance Inquiry</a></li>
<li><a href="history.html">History Inquiry</a></li>
</ul>

</nav>

</header>

<div class="container">

<h2 style="margin-bottom:20px;">Bank Transactions</h2>

<div class="tabs">

<button class="active" onclick="showForm('deposit', this)">
Deposit
</button>

<button onclick="showForm('withdraw', this)">
Withdraw
</button>

<button onclick="showForm('transfer', this)">
Transfer
</button>

</div>

<div id="deposit" class="form active">

<div class="form-group">
<label>Account Number</label>
<input type="text" id="depositAccount">
</div>

<div class="form-group">
<label>Amount</label>
<input type="number" id="depositAmount">
</div>

<div class="form-group">
<label>Narration Line 1</label>
<input type="text" id="depositNarration1">
</div>

<div class="form-group">
<label>Narration Line 2</label>
<input type="text" id="depositNarration2">
</div>

<div class="form-group">
<label>Narration Line 3</label>
<input type="text" id="depositNarration3">
</div>

<button class="submit" id="depositBtn">
Deposit Money
</button>

</div>

<div id="withdraw" class="form">

<div class="form-group">
<label>Account Number</label>
<input type="text" id="withdrawAccount">
</div>

<div class="form-group">
<label>Amount</label>
<input type="number" id="withdrawAmount">
</div>

<div class="form-group">
<label>Narration Line 1</label>
<input type="text" id="withdrawNarration1">
</div>

<div class="form-group">
<label>Narration Line 2</label>
<input type="text" id="withdrawNarration2">
</div>

<div class="form-group">
<label>Narration Line 3</label>
<input type="text" id="withdrawNarration3">
</div>

<button class="submit" id="withdrawBtn">
Withdraw Money
</button>

</div>

<div id="transfer" class="form">

<div class="form-group">
<label>From Account</label>
<input type="text" id="fromAccount">
</div>

<div class="form-group">
<label>To Account</label>
<input type="text" id="toAccount">
</div>

<div class="form-group">
<label>Amount</label>
<input type="number" id="transferAmount">
</div>

<div class="form-group">
<label>Narration Line 1</label>
<input type="text" id="transferNarration1">
</div>

<div class="form-group">
<label>Narration Line 2</label>
<input type="text" id="transferNarration2">
</div>

<div class="form-group">
<label>Narration Line 3</label>
<input type="text" id="transferNarration3">
</div>

<button class="submit" id="transferBtn">
Transfer Money
</button>

</div>
</div>
<div id="successModal" class="modal">

    <div class="modal-content">

        <div class="success-icon">
            ✓
        </div>

        <h2>Transaction Successful</h2>

        <div id="transactionDetails"></div>

        <button id="closeModal">
            OK
        </button>

    </div>

</div>
    <script src="transaction.js"></script>
</body>
</html>
