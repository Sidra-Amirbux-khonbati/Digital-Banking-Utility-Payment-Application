<div class="container">

    <h1>Admin Dashboard</h1>

    <h2>Pending Company Requests</h2>


    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Company Name</th>
                <th>Type</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>


        <tbody id="companyTable">

        </tbody>


    </table>

<div id="successModal" class="modal">

    <div class="modal-content">

        <h2>✅ Company Approved</h2>

        <div id="companyDetails"></div>

        <button onclick="closeModal()">
            Close
        </button>

    </div>

</div>

<div id="rejectModal" class="modal">

    <div class="modal-content">

        <h2 style="color:red;">❌ Company Rejected</h2>

        <div id="rejectDetails"></div>

        <button onclick="closeRejectModal()">
            Close
        </button>

    </div>

</div>
